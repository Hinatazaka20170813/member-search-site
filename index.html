<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メンバー検索</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .description {
      color: #666;
      line-height: 1.7;
    }

    .search-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    #searchButton {
      background: #2563eb;
      color: white;
    }

    #resetButton {
      background: #e5e7eb;
      color: #222;
    }

    #status {
      margin-top: 20px;
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 760px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f1f3f5;
    }

    tr:hover {
      background: #f9fafb;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>メンバー検索</h1>

    <p class="description">
      名前・生年月日・星座・身長・出身地・血液型を入力して検索できます。
      生年月日と身長は範囲指定できます。
      入力しなかった項目は検索条件から外されます。
    </p>

    <div class="search-area">
      <label>
        名前
        <input id="nameInput" type="text" placeholder="例：小坂、菜緒、小坂 菜緒">
      </label>

      <label>
        生年月日（開始）
        <input id="birthdayFromInput" type="date">
      </label>

      <label>
        生年月日（終了）
        <input id="birthdayToInput" type="date">
      </label>

      <label>
        星座
        <input id="zodiacInput" type="text" placeholder="例：おとめ座">
      </label>

      <label>
        身長（最小）
        <input id="heightMinInput" type="number" step="0.1" placeholder="例：150">
      </label>

      <label>
        身長（最大）
        <input id="heightMaxInput" type="number" step="0.1" placeholder="例：170">
      </label>

      <label>
        出身地
        <input id="birthplaceInput" type="text" placeholder="例：大阪、大阪府">
      </label>

      <label>
        血液型
        <input id="bloodTypeInput" type="text" placeholder="例：A、A型">
      </label>
    </div>

    <div class="buttons">
      <button id="searchButton">検索</button>
      <button id="resetButton">リセット</button>
    </div>

    <p id="status">データを読み込み中です。</p>

    <div class="table-wrap">
      <table id="resultTable" style="display: none;">
        <thead>
          <tr>
            <th>名前</th>
            <th>生年月日</th>
            <th>星座</th>
            <th>身長</th>
            <th>出身地</th>
            <th>血液型</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let members = [];

    function normalizeName(text) {
      return text.trim().replace(/\s+/g, "");
    }

    function normalizeBloodType(text) {
      text = text.trim().toUpperCase();

      if (!text) return "";

      if (text === "不明") return "不明";

      if (!text.endsWith("型")) {
        text += "型";
      }

      return text;
    }

    function birthdayToNumber(text) {
      text = text.trim();

      if (!text || text === "不明") return null;

      // 入力欄 type="date" の形式：2002-09-07
      let match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      // members.txt の形式：2002年9月7日
      if (!match) {
        match = text.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
      }

      if (!match) return null;

      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);

      return year * 10000 + month * 100 + day;
    }

    function heightToNumber(text) {
      text = String(text).trim()
        .replace(/cm/gi, "")
        .replaceAll("㎝", "")
        .replaceAll("ＣＭ", "")
        .replaceAll("ｃｍ", "");

      if (!text || text === "不明") return null;

      const height = Number(text);

      if (Number.isNaN(height)) return null;

      return height;
    }

    function parseMembers(text) {
      const lines = text.split(/\r?\n/);
      const parsed = [];

      for (const line of lines) {
        const trimmedLine = line.trim();

        if (!trimmedLine) continue;
        if (!trimmedLine.includes("：")) continue;

        const [name, profile] = trimmedLine.split("：");
        const parts = profile.split("／").map(part => part.trim());

        if (parts.length !== 5) continue;

        const [birthday, zodiac, height, birthplace, bloodType] = parts;

        parsed.push({
          name: name.trim(),
          birthday,
          zodiac,
          height,
          birthplace,
          bloodType
        });
      }

      return parsed;
    }

    async function loadMembers() {
      try {
        const response = await fetch("members.txt");

        if (!response.ok) {
          throw new Error("members.txt を読み込めませんでした。");
        }

        const text = await response.text();
        members = parseMembers(text);

        document.getElementById("status").textContent =
          `${members.length}人分のデータを読み込みました。検索条件を入力してください。`;

      } catch (error) {
        document.getElementById("status").textContent =
          "データの読み込みに失敗しました。index.html と members.txt が同じフォルダにあるか確認してください。";
      }
    }

    function searchMembers() {
      const name = normalizeName(document.getElementById("nameInput").value);

      const birthdayFrom = birthdayToNumber(
        document.getElementById("birthdayFromInput").value
      );

      const birthdayTo = birthdayToNumber(
        document.getElementById("birthdayToInput").value
      );

      const zodiac = document.getElementById("zodiacInput").value.trim();

      const heightMin = heightToNumber(
        document.getElementById("heightMinInput").value
      );

      const heightMax = heightToNumber(
        document.getElementById("heightMaxInput").value
      );

      const birthplace = document.getElementById("birthplaceInput").value.trim();

      const bloodType = normalizeBloodType(
        document.getElementById("bloodTypeInput").value
      );

      const results = members.filter(member => {
        if (name && !normalizeName(member.name).includes(name)) {
          return false;
        }

        const memberBirthday = birthdayToNumber(member.birthday);

        if (birthdayFrom !== null) {
          if (memberBirthday === null || memberBirthday < birthdayFrom) {
            return false;
          }
        }

        if (birthdayTo !== null) {
          if (memberBirthday === null || memberBirthday > birthdayTo) {
            return false;
          }
        }

        if (zodiac && member.zodiac !== zodiac) {
          return false;
        }

        const memberHeight = heightToNumber(member.height);

        if (heightMin !== null) {
          if (memberHeight === null || memberHeight < heightMin) {
            return false;
          }
        }

        if (heightMax !== null) {
          if (memberHeight === null || memberHeight > heightMax) {
            return false;
          }
        }

        if (birthplace && !member.birthplace.includes(birthplace)) {
          return false;
        }

        if (bloodType && normalizeBloodType(member.bloodType) !== bloodType) {
          return false;
        }

        return true;
      });

      showResults(results);
    }

    function showResults(results) {
      const status = document.getElementById("status");
      const table = document.getElementById("resultTable");
      const tbody = document.getElementById("resultBody");

      tbody.innerHTML = "";

      if (results.length === 0) {
        status.textContent = "該当するメンバーはいません。";
        table.style.display = "none";
        return;
      }

      status.textContent = `${results.length}件見つかりました。`;
      table.style.display = "table";

      for (const member of results) {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${escapeHtml(member.name)}</td>
          <td>${escapeHtml(member.birthday)}</td>
          <td>${escapeHtml(member.zodiac)}</td>
          <td>${escapeHtml(member.height)}</td>
          <td>${escapeHtml(member.birthplace)}</td>
          <td>${escapeHtml(member.bloodType)}</td>
        `;

        tbody.appendChild(tr);
      }
    }

    function resetSearch() {
      document.getElementById("nameInput").value = "";

      document.getElementById("birthdayFromInput").value = "";
      document.getElementById("birthdayToInput").value = "";

      document.getElementById("zodiacInput").value = "";

      document.getElementById("heightMinInput").value = "";
      document.getElementById("heightMaxInput").value = "";

      document.getElementById("birthplaceInput").value = "";
      document.getElementById("bloodTypeInput").value = "";

      document.getElementById("resultTable").style.display = "none";
      document.getElementById("status").textContent =
        `${members.length}人分のデータを読み込みました。検索条件を入力してください。`;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("searchButton").addEventListener("click", searchMembers);
    document.getElementById("resetButton").addEventListener("click", resetSearch);

    loadMembers();
  </script>
</body>
</html>
