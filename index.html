<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メンバー検索</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .description {
      color: #666;
      line-height: 1.7;
    }

    .search-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .wide-box {
      grid-column: span 2;
    }

    .mode-box {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      background: #fafafa;
    }

    .mode-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .date-selects {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .small-label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    select {
      cursor: pointer;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    #searchButton {
      background: #2563eb;
      color: white;
    }

    #resetButton {
      background: #e5e7eb;
      color: #222;
    }

    #status {
      margin-top: 20px;
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 760px;
    }

    th,
    td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f1f3f5;
    }

    tr:hover {
      background: #f9fafb;
    }

    .signature {
      margin-top: 24px;
      text-align: right;
      color: #777;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 18px;
      }

      .wide-box {
        grid-column: span 1;
      }

      .range-row {
        grid-template-columns: 1fr;
      }

      .date-selects {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .signature {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>メンバー検索</h1>

    <p class="description">
      名前・生年月日・星座・身長・出身地・血液型を入力して検索できます。
      入力しなかった項目は検索条件から外されます。
      生年月日は、年・月・日をそれぞれドラムロール形式で選択できます。
    </p>

    <div class="search-area">
      <label>
        名前
        <input id="nameInput" type="text" placeholder="例：小坂、菜緒、小坂 菜緒">
      </label>

      <div class="mode-box wide-box">
        <div class="mode-title">生年月日</div>

        <div class="date-selects">
          <label>
            <span class="small-label">年</span>
            <select id="birthdayYearInput"></select>
          </label>

          <label>
            <span class="small-label">月</span>
            <select id="birthdayMonthInput"></select>
          </label>

          <label>
            <span class="small-label">日</span>
            <select id="birthdayDayInput"></select>
          </label>
        </div>
      </div>

      <label>
        星座
        <input id="zodiacInput" type="text" placeholder="例：おとめ座">
      </label>

      <div class="mode-box wide-box">
        <div class="mode-title">身長</div>

        <label>
          入力方法
          <select id="heightModeInput">
            <option value="picker">ピッカー / ドラムロール</option>
            <option value="keyboard">キーボード</option>
          </select>
        </label>

        <div id="heightPickerArea" class="range-row" style="margin-top: 12px;">
          <label>
            身長（最小）
            <select id="heightMinPickerInput"></select>
          </label>

          <label>
            身長（最大）
            <select id="heightMaxPickerInput"></select>
          </label>
        </div>

        <div id="heightKeyboardArea" class="range-row" style="display: none; margin-top: 12px;">
          <label>
            身長（最小）
            <input id="heightMinKeyboardInput" type="number" step="0.1" placeholder="例：150">
          </label>

          <label>
            身長（最大）
            <input id="heightMaxKeyboardInput" type="number" step="0.1" placeholder="例：170">
          </label>
        </div>
      </div>

      <label>
        出身地
        <input id="birthplaceInput" type="text" placeholder="例：大阪、大阪府">
      </label>

      <label>
        血液型
        <input id="bloodTypeInput" type="text" placeholder="例：A、A型">
      </label>

      <label>
        並び替え対象
        <select id="sortTargetInput">
          <option value="auto">検索条件に合わせて自動</option>
          <option value="birthday">生年月日順</option>
          <option value="height">身長順</option>
          <option value="none">並び替えなし</option>
        </select>
      </label>

      <label>
        並び順
        <select id="sortOrderInput">
          <option value="asc">昇順</option>
          <option value="desc">降順</option>
        </select>
      </label>
    </div>

    <div class="buttons">
      <button id="searchButton">検索</button>
      <button id="resetButton">リセット</button>
    </div>

    <p id="status">データを読み込み中です。</p>

    <div class="table-wrap">
      <table id="resultTable" style="display: none;">
        <thead>
          <tr>
            <th>名前</th>
            <th>生年月日</th>
            <th>星座</th>
            <th>身長</th>
            <th>出身地</th>
            <th>血液型</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>

    <div class="signature">
      けやき坂46追加メンバー募集オーデション No.24
    </div>
  </div>

  <script>
    let members = [];

    function normalizeName(text) {
      return String(text).trim().replace(/\s+/g, "");
    }

    function normalizeBloodType(text) {
      text = String(text).trim().toUpperCase();

      if (!text) return "";
      if (text === "不明") return "不明";

      if (!text.endsWith("型")) {
        text += "型";
      }

      return text;
    }

    function toHalfWidthNumber(text) {
      return String(text).replace(/[０-９]/g, char => {
        return String.fromCharCode(char.charCodeAt(0) - 0xFEE0);
      });
    }

    function birthdayToParts(text) {
      text = toHalfWidthNumber(text).trim();

      if (!text || text === "不明") return null;

      let match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      if (!match) {
        match = text.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
      }

      if (!match) {
        match = text.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
      }

      if (!match) return null;

      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);

      if (
        Number.isNaN(year) ||
        Number.isNaN(month) ||
        Number.isNaN(day)
      ) {
        return null;
      }

      return {
        year,
        month,
        day,
        number: year * 10000 + month * 100 + day
      };
    }

    function birthdayToNumber(text) {
      const parts = birthdayToParts(text);
      return parts ? parts.number : null;
    }

    function heightToNumber(text) {
      text = toHalfWidthNumber(text).trim()
        .replace("cm", "")
        .replace("CM", "")
        .replace("㎝", "")
        .replace("ＣＭ", "")
        .replace("ｃｍ", "");

      if (!text || text === "不明") return null;

      const height = Number(text);

      if (Number.isNaN(height)) return null;

      return height;
    }

    function parseMembers(text) {
      const lines = text.split(/\r?\n/);
      const parsed = [];

      for (const line of lines) {
        const trimmedLine = line.trim();

        if (!trimmedLine) continue;
        if (!trimmedLine.includes("：")) continue;

        const [name, profile] = trimmedLine.split("：");
        const parts = profile.split("／").map(part => part.trim());

        if (parts.length !== 5) continue;

        const [birthday, zodiac, height, birthplace, bloodType] = parts;

        parsed.push({
          name: name.trim(),
          birthday,
          zodiac,
          height,
          birthplace,
          bloodType
        });
      }

      return parsed;
    }

    function createYearOptions(selectElement, placeholderText) {
      selectElement.innerHTML = "";

      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = placeholderText;
      selectElement.appendChild(emptyOption);

      const currentYear = new Date().getFullYear();

      for (let year = currentYear; year >= 1900; year--) {
        const option = document.createElement("option");
        option.value = String(year);
        option.textContent = `${year}年`;
        selectElement.appendChild(option);
      }
    }

    function createMonthOptions(selectElement, placeholderText) {
      selectElement.innerHTML = "";

      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = placeholderText;
      selectElement.appendChild(emptyOption);

      for (let month = 1; month <= 12; month++) {
        const option = document.createElement("option");
        option.value = String(month);
        option.textContent = `${month}月`;
        selectElement.appendChild(option);
      }
    }

    function getLastDayOfMonth(year, month) {
      if (!month) return 31;

      if (!year) {
        if (month === 2) return 29;
        if ([4, 6, 9, 11].includes(month)) return 30;
        return 31;
      }

      return new Date(year, month, 0).getDate();
    }

    function createDayOptions(selectElement, placeholderText, year, month) {
      const currentValue = selectElement.value;

      selectElement.innerHTML = "";

      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = placeholderText;
      selectElement.appendChild(emptyOption);

      const lastDay = getLastDayOfMonth(year, month);

      for (let day = 1; day <= lastDay; day++) {
        const option = document.createElement("option");
        option.value = String(day);
        option.textContent = `${day}日`;
        selectElement.appendChild(option);
      }

      if (currentValue && Number(currentValue) <= lastDay) {
        selectElement.value = currentValue;
      } else {
        selectElement.value = "";
      }
    }

    function updateBirthdayDayOptions() {
      const yearValue = document.getElementById("birthdayYearInput").value;
      const monthValue = document.getElementById("birthdayMonthInput").value;

      const year = yearValue ? Number(yearValue) : null;
      const month = monthValue ? Number(monthValue) : null;

      createDayOptions(
        document.getElementById("birthdayDayInput"),
        "指定なし",
        year,
        month
      );
    }

    function getSelectedBirthdayParts() {
      const yearText = document.getElementById("birthdayYearInput").value;
      const monthText = document.getElementById("birthdayMonthInput").value;
      const dayText = document.getElementById("birthdayDayInput").value;

      return {
        year: yearText ? Number(yearText) : null,
        month: monthText ? Number(monthText) : null,
        day: dayText ? Number(dayText) : null
      };
    }

    function hasBirthdayCondition(parts) {
      return parts.year !== null || parts.month !== null || parts.day !== null;
    }

    function createHeightOptions(selectElement, placeholderText) {
      selectElement.innerHTML = "";

      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = placeholderText;
      selectElement.appendChild(emptyOption);

      for (let height = 120; height <= 200; height += 0.5) {
        const option = document.createElement("option");
        const value = height.toFixed(1).replace(".0", "");

        option.value = value;
        option.textContent = `${value}cm`;

        selectElement.appendChild(option);
      }
    }

    function updateHeightInputMode() {
      const mode = document.getElementById("heightModeInput").value;

      document.getElementById("heightPickerArea").style.display =
        mode === "picker" ? "grid" : "none";

      document.getElementById("heightKeyboardArea").style.display =
        mode === "keyboard" ? "grid" : "none";
    }

    function getHeightRange() {
      const mode = document.getElementById("heightModeInput").value;

      if (mode === "picker") {
        return {
          min: heightToNumber(document.getElementById("heightMinPickerInput").value),
          max: heightToNumber(document.getElementById("heightMaxPickerInput").value)
        };
      }

      return {
        min: heightToNumber(document.getElementById("heightMinKeyboardInput").value),
        max: heightToNumber(document.getElementById("heightMaxKeyboardInput").value)
      };
    }

    async function loadMembers() {
      try {
        const response = await fetch("members.txt");

        if (!response.ok) {
          throw new Error("members.txt を読み込めませんでした。");
        }

        const text = await response.text();
        members = parseMembers(text);

        document.getElementById("status").textContent =
          "検索条件を入力してください。";

      } catch (error) {
        document.getElementById("status").textContent =
          "データの読み込みに失敗しました。index.html と members.txt が同じフォルダにあるか確認してください。";
      }
    }

    function searchMembers() {
      const name = normalizeName(document.getElementById("nameInput").value);
      const zodiac = document.getElementById("zodiacInput").value.trim();
      const birthplace = document.getElementById("birthplaceInput").value.trim();
      const bloodType = normalizeBloodType(document.getElementById("bloodTypeInput").value);

      const birthdayCondition = getSelectedBirthdayParts();
      const isBirthdaySearch = hasBirthdayCondition(birthdayCondition);

      const heightRange = getHeightRange();

      const isHeightSearch =
        heightRange.min !== null || heightRange.max !== null;

      let results = members.filter(member => {
        if (name && !normalizeName(member.name).includes(name)) {
          return false;
        }

        if (isBirthdaySearch) {
          const memberBirthday = birthdayToParts(member.birthday);

          if (memberBirthday === null) {
            return false;
          }

          if (
            birthdayCondition.year !== null &&
            memberBirthday.year !== birthdayCondition.year
          ) {
            return false;
          }

          if (
            birthdayCondition.month !== null &&
            memberBirthday.month !== birthdayCondition.month
          ) {
            return false;
          }

          if (
            birthdayCondition.day !== null &&
            memberBirthday.day !== birthdayCondition.day
          ) {
            return false;
          }
        }

        if (zodiac && member.zodiac !== zodiac) {
          return false;
        }

        const memberHeight = heightToNumber(member.height);

        if (heightRange.min !== null) {
          if (memberHeight === null || memberHeight < heightRange.min) {
            return false;
          }
        }

        if (heightRange.max !== null) {
          if (memberHeight === null || memberHeight > heightRange.max) {
            return false;
          }
        }

        if (birthplace && !member.birthplace.includes(birthplace)) {
          return false;
        }

        if (bloodType && normalizeBloodType(member.bloodType) !== bloodType) {
          return false;
        }

        return true;
      });

      results = sortResults(results, isBirthdaySearch, isHeightSearch);

      showResults(results);
    }

    function sortResults(results, isBirthdaySearch, isHeightSearch) {
      const sortTargetInput = document.getElementById("sortTargetInput").value;
      const sortOrder = document.getElementById("sortOrderInput").value;

      let sortTarget = sortTargetInput;

      if (sortTarget === "auto") {
        if (isBirthdaySearch) {
          sortTarget = "birthday";
        } else if (isHeightSearch) {
          sortTarget = "height";
        } else {
          sortTarget = "none";
        }
      }

      if (sortTarget === "none") {
        return results;
      }

      const sorted = [...results];

      sorted.sort((a, b) => {
        let valueA = null;
        let valueB = null;

        if (sortTarget === "birthday") {
          valueA = birthdayToNumber(a.birthday);
          valueB = birthdayToNumber(b.birthday);
        }

        if (sortTarget === "height") {
          valueA = heightToNumber(a.height);
          valueB = heightToNumber(b.height);
        }

        if (valueA === null && valueB === null) {
          return a.name.localeCompare(b.name, "ja");
        }

        if (valueA === null) return 1;
        if (valueB === null) return -1;

        const result = valueA - valueB;

        if (sortOrder === "asc") {
          return result;
        }

        return -result;
      });

      return sorted;
    }

    function showResults(results) {
      const status = document.getElementById("status");
      const table = document.getElementById("resultTable");
      const tbody = document.getElementById("resultBody");

      tbody.innerHTML = "";

      if (results.length === 0) {
        status.textContent = "該当するメンバーはいません。";
        table.style.display = "none";
        return;
      }

      status.textContent = `${results.length}件見つかりました。`;
      table.style.display = "table";

      for (const member of results) {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${escapeHtml(member.name)}</td>
          <td>${escapeHtml(member.birthday)}</td>
          <td>${escapeHtml(member.zodiac)}</td>
          <td>${escapeHtml(member.height)}</td>
          <td>${escapeHtml(member.birthplace)}</td>
          <td>${escapeHtml(member.bloodType)}</td>
        `;

        tbody.appendChild(tr);
      }
    }

    function resetSearch() {
      document.getElementById("nameInput").value = "";

      document.getElementById("birthdayYearInput").value = "";
      document.getElementById("birthdayMonthInput").value = "";
      document.getElementById("birthdayDayInput").value = "";
      updateBirthdayDayOptions();

      document.getElementById("zodiacInput").value = "";

      document.getElementById("heightMinPickerInput").value = "";
      document.getElementById("heightMaxPickerInput").value = "";
      document.getElementById("heightMinKeyboardInput").value = "";
      document.getElementById("heightMaxKeyboardInput").value = "";

      document.getElementById("birthplaceInput").value = "";
      document.getElementById("bloodTypeInput").value = "";

      document.getElementById("sortTargetInput").value = "auto";
      document.getElementById("sortOrderInput").value = "asc";

      document.getElementById("resultTable").style.display = "none";
      document.getElementById("status").textContent =
        "検索条件を入力してください。";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    createYearOptions(
      document.getElementById("birthdayYearInput"),
      "指定なし"
    );

    createMonthOptions(
      document.getElementById("birthdayMonthInput"),
      "指定なし"
    );

    createDayOptions(
      document.getElementById("birthdayDayInput"),
      "指定なし",
      null,
      null
    );

    document.getElementById("birthdayYearInput")
      .addEventListener("change", updateBirthdayDayOptions);

    document.getElementById("birthdayMonthInput")
      .addEventListener("change", updateBirthdayDayOptions);

    createHeightOptions(
      document.getElementById("heightMinPickerInput"),
      "指定なし"
    );

    createHeightOptions(
      document.getElementById("heightMaxPickerInput"),
      "指定なし"
    );

    document.getElementById("heightModeInput")
      .addEventListener("change", updateHeightInputMode);

    document.getElementById("searchButton")
      .addEventListener("click", searchMembers);

    document.getElementById("resetButton")
      .addEventListener("click", resetSearch);

    updateHeightInputMode();
    loadMembers();
  </script>
</body>
</html>
