<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メンバー検索</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .description {
      color: #666;
      line-height: 1.7;
    }

    .search-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .wide-box {
      grid-column: span 2;
    }

    .mode-box {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      background: #fafafa;
    }

    .mode-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .mode-select {
      margin-bottom: 12px;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    #searchButton {
      background: #2563eb;
      color: white;
    }

    #resetButton {
      background: #e5e7eb;
      color: #222;
    }

    #status {
      margin-top: 20px;
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 760px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f1f3f5;
    }

    tr:hover {
      background: #f9fafb;
    }

    @media (max-width: 700px) {
      .wide-box {
        grid-column: span 1;
      }

      .range-row {
        grid-template-columns: 1fr;
      }

      body {
        padding: 12px;
      }

      .container {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>メンバー検索</h1>

    <p class="description">
      名前・生年月日・星座・身長・出身地・血液型を入力して検索できます。
      入力しなかった項目は検索条件から外されます。
      生年月日と身長は、ピッカー入力とキーボード入力を切り替えられます。
    </p>

    <div class="search-area">
      <label>
        名前
        <input id="nameInput" type="text" placeholder="例：小坂、菜緒、小坂 菜緒">
      </label>

      <div class="mode-box wide-box">
        <div class="mode-title">生年月日</div>

        <label class="mode-select">
          入力方法
          <select id="birthdayModeInput">
            <option value="picker">ピッカー / ドラムロール</option>
            <option value="keyboard">キーボード</option>
          </select>
        </label>

        <div id="birthdayPickerArea" class="range-row">
          <label>
            生年月日（開始）
            <input id="birthdayFromPickerInput" type="date">
          </label>

          <label>
            生年月日（終了）
            <input id="birthdayToPickerInput" type="date">
          </label>
        </div>

        <div id="birthdayKeyboardArea" class="range-row" style="display: none;">
          <label>
            生年月日（開始）
            <input id="birthdayFromKeyboardInput" type="text" placeholder="例：2000-01-01、2000年1月1日">
          </label>

          <label>
            生年月日（終了）
            <input id="birthdayToKeyboardInput" type="text" placeholder="例：2005-12-31、2005年12月31日">
          </label>
        </div>
      </div>

      <label>
        星座
        <input id="zodiacInput" type="text" placeholder="例：おとめ座">
      </label>

      <div class="mode-box wide-box">
        <div class="mode-title">身長</div>

        <label class="mode-select">
          入力方法
          <select id="heightModeInput">
            <option value="picker">ピッカー / ドラムロール</option>
            <option value="keyboard">キーボード</option>
          </select>
        </label>

        <div id="heightPickerArea" class="range-row">
          <label>
            身長（最小）
            <select id="heightMinPickerInput"></select>
          </label>

          <label>
            身長（最大）
            <select id="heightMaxPickerInput"></select>
          </label>
        </div>

        <div id="heightKeyboardArea" class="range-row" style="display: none;">
          <label>
            身長（最小）
            <input id="heightMinKeyboardInput" type="number" step="0.1" placeholder="例：150">
          </label>

          <label>
            身長（最大）
            <input id="heightMaxKeyboardInput" type="number" step="0.1" placeholder="例：170">
          </label>
        </div>
      </div>

      <label>
        出身地
        <input id="birthplaceInput" type="text" placeholder="例：大阪、大阪府">
      </label>

      <label>
        血液型
        <input id="bloodTypeInput" type="text" placeholder="例：A、A型">
      </label>

      <label>
        並び替え対象
        <select id="sortTargetInput">
          <option value="auto">検索条件に合わせて自動</option>
          <option value="birthday">生年月日順</option>
          <option value="height">身長順</option>
          <option value="none">並び替えなし</option>
        </select>
      </label>

      <label>
        並び順
        <select id="sortOrderInput">
          <option value="asc">昇順</option>
          <option value="desc">降順</option>
        </select>
      </label>
    </div>

    <div class="buttons">
      <button id="searchButton">検索</button>
      <button id="resetButton">リセット</button>
    </div>

    <p id="status">データを読み込み中です。</p>

    <div class="table-wrap">
      <table id="resultTable" style="display: none;">
        <thead>
          <tr>
            <th>名前</th>
            <th>生年月日</th>
            <th>星座</th>
            <th>身長</th>
            <th>出身地</th>
            <th>血液型</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let members = [];

    function normalizeName(text) {
      return text.trim().replace(/\s+/g, "");
    }

    function normalizeBloodType(text) {
      text = text.trim().toUpperCase();

      if (!text) return "";

      if (text === "不明") return "不明";

      if (!text.endsWith("型")) {
        text += "型";
      }

      return text;
    }

    function birthdayToNumber(text) {
      text = String(text).trim();

      if (!text || text === "不明") return null;

      // ピッカー入力の形式：2002-09-07
      let match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      // members.txt の形式：2002年9月7日
      if (!match) {
        match = text.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
      }

      // 2002/09/07 も一応対応
      if (!match) {
        match = text.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
      }

      if (!match) return null;

      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);

      if (
        Number.isNaN(year) ||
        Number.isNaN(month) ||
        Number.isNaN(day)
      ) {
        return null;
      }

      return year * 10000 + month * 100 + day;
    }

    function heightToNumber(text) {
      text = String(text).trim()
        .replace("cm", "")
        .replace("CM", "")
        .replace("㎝", "")
        .replace("ＣＭ", "")
        .replace("ｃｍ", "");

      if (!text || text === "不明") return null;

      const height = Number(text);

      if (Number.isNaN(height)) return null;

      return height;
    }

    function parseMembers(text) {
      const lines = text.split(/\r?\n/);
      const parsed = [];

      for (const line of lines) {
        const trimmedLine = line.trim();

        if (!trimmedLine) continue;
        if (!trimmedLine.includes("：")) continue;

        const [name, profile] = trimmedLine.split("：");
        const parts = profile.split("／").map(part => part.trim());

        if (parts.length !== 5) continue;

        const [birthday, zodiac, height, birthplace, bloodType] = parts;

        parsed.push({
          name: name.trim(),
          birthday,
          zodiac,
          height,
          birthplace,
          bloodType
        });
      }

      return parsed;
    }

    function createHeightOptions(selectElement, placeholderText) {
      selectElement.innerHTML = "";

      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = placeholderText;
      selectElement.appendChild(emptyOption);

      // 必要に応じて範囲は変更OK
      // 例：120〜200cm、0.5cm刻み
      for (let height = 120; height <= 200; height += 0.5) {
        const option = document.createElement("option");
        const value = height.toFixed(1).replace(".0", "");

        option.value = value;
        option.textContent = `${value}cm`;

        selectElement.appendChild(option);
      }
    }

    function updateBirthdayInputMode() {
      const mode = document.getElementById("birthdayModeInput").value;

      document.getElementById("birthdayPickerArea").style.display =
        mode === "picker" ? "grid" : "none";

      document.getElementById("birthdayKeyboardArea").style.display =
        mode === "keyboard" ? "grid" : "none";
    }

    function updateHeightInputMode() {
      const mode = document.getElementById("heightModeInput").value;

      document.getElementById("heightPickerArea").style.display =
        mode === "picker" ? "grid" : "none";

      document.getElementById("heightKeyboardArea").style.display =
        mode === "keyboard" ? "grid" : "none";
    }

    function getBirthdayRange() {
      const mode = document.getElementById("birthdayModeInput").value;

      if (mode === "picker") {
        return {
          from: birthdayToNumber(document.getElementById("birthdayFromPickerInput").value),
          to: birthdayToNumber(document.getElementById("birthdayToPickerInput").value)
        };
      }

      return {
        from: birthdayToNumber(document.getElementById("birthdayFromKeyboardInput").value),
        to: birthdayToNumber(document.getElementById("birthdayToKeyboardInput").value)
      };
    }

    function getHeightRange() {
      const mode = document.getElementById("heightModeInput").value;

      if (mode === "picker") {
        return {
          min: heightToNumber(document.getElementById("heightMinPickerInput").value),
          max: heightToNumber(document.getElementById("heightMaxPickerInput").value)
        };
      }

      return {
        min: heightToNumber(document.getElementById("heightMinKeyboardInput").value),
        max: heightToNumber(document.getElementById("heightMaxKeyboardInput").value)
      };
    }

    async function loadMembers() {
      try {
        const response = await fetch("members.txt");

        if (!response.ok) {
          throw new Error("members.txt を読み込めませんでした。");
        }

        const text = await response.text();
        members = parseMembers(text);

        document.getElementById("status").textContent =
          `${members.length}人分のデータを読み込みました。検索条件を入力してください。`;

      } catch (error) {
        document.getElementById("status").textContent =
          "データの読み込みに失敗しました。index.html と members.txt が同じフォルダにあるか確認してください。";
      }
    }

    function searchMembers() {
      const name = normalizeName(document.getElementById("nameInput").value);
      const zodiac = document.getElementById("zodiacInput").value.trim();
      const birthplace = document.getElementById("birthplaceInput").value.trim();
      const bloodType = normalizeBloodType(document.getElementById("bloodTypeInput").value);

      const birthdayRange = getBirthdayRange();
      const heightRange = getHeightRange();

      const isBirthdaySearch =
        birthdayRange.from !== null || birthdayRange.to !== null;

      const isHeightSearch =
        heightRange.min !== null || heightRange.max !== null;

      let results = members.filter(member => {
        if (name && !normalizeName(member.name).includes(name)) {
          return false;
        }

        const memberBirthday = birthdayToNumber(member.birthday);

        if (birthdayRange.from !== null) {
          if (memberBirthday === null || memberBirthday < birthdayRange.from) {
            return false;
          }
        }

        if (birthdayRange.to !== null) {
          if (memberBirthday === null || memberBirthday > birthdayRange.to) {
            return false;
          }
        }

        if (zodiac && member.zodiac !== zodiac) {
          return false;
        }

        const memberHeight = heightToNumber(member.height);

        if (heightRange.min !== null) {
          if (memberHeight === null || memberHeight < heightRange.min) {
            return false;
          }
        }

        if (heightRange.max !== null) {
          if (memberHeight === null || memberHeight > heightRange.max) {
            return false;
          }
        }

        if (birthplace && !member.birthplace.includes(birthplace)) {
          return false;
        }

        if (bloodType && normalizeBloodType(member.bloodType) !== bloodType) {
          return false;
        }

        return true;
      });

      results = sortResults(results, isBirthdaySearch, isHeightSearch);

      showResults(results);
    }

    function sortResults(results, isBirthdaySearch, isHeightSearch) {
      const sortTargetInput = document.getElementById("sortTargetInput").value;
      const sortOrder = document.getElementById("sortOrderInput").value;

      let sortTarget = sortTargetInput;

      if (sortTarget === "auto") {
        if (isBirthdaySearch) {
          sortTarget = "birthday";
        } else if (isHeightSearch) {
          sortTarget = "height";
        } else {
          sortTarget = "none";
        }
      }

      if (sortTarget === "none") {
        return results;
      }

      const sorted = [...results];

      sorted.sort((a, b) => {
        let valueA = null;
        let valueB = null;

        if (sortTarget === "birthday") {
          valueA = birthdayToNumber(a.birthday);
          valueB = birthdayToNumber(b.birthday);
        }

        if (sortTarget === "height") {
          valueA = heightToNumber(a.height);
          valueB = heightToNumber(b.height);
        }

        // 不明なデータは後ろに回す
        if (valueA === null && valueB === null) {
          return a.name.localeCompare(b.name, "ja");
        }

        if (valueA === null) return 1;
        if (valueB === null) return -1;

        const result = valueA - valueB;

        if (sortOrder === "asc") {
          return result;
        }

        return -result;
      });

      return sorted;
    }

    function showResults(results) {
      const status = document.getElementById("status");
      const table = document.getElementById("resultTable");
      const tbody = document.getElementById("resultBody");

      tbody.innerHTML = "";

      if (results.length === 0) {
        status.textContent = "該当するメンバーはいません。";
        table.style.display = "none";
        return;
      }

      status.textContent = `${results.length}件見つかりました。`;
      table.style.display = "table";

      for (const member of results) {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${escapeHtml(member.name)}</td>
          <td>${escapeHtml(member.birthday)}</td>
          <td>${escapeHtml(member.zodiac)}</td>
          <td>${escapeHtml(member.height)}</td>
          <td>${escapeHtml(member.birthplace)}</td>
          <td>${escapeHtml(member.bloodType)}</td>
        `;

        tbody.appendChild(tr);
      }
    }

    function resetSearch() {
      document.getElementById("nameInput").value = "";

      document.getElementById("birthdayFromPickerInput").value = "";
      document.getElementById("birthdayToPickerInput").value = "";
      document.getElementById("birthdayFromKeyboardInput").value = "";
      document.getElementById("birthdayToKeyboardInput").value = "";

      document.getElementById("zodiacInput").value = "";

      document.getElementById("heightMinPickerInput").value = "";
      document.getElementById("heightMaxPickerInput").value = "";
      document.getElementById("heightMinKeyboardInput").value = "";
      document.getElementById("heightMaxKeyboardInput").value = "";

      document.getElementById("birthplaceInput").value = "";
      document.getElementById("bloodTypeInput").value = "";

      document.getElementById("sortTargetInput").value = "auto";
      document.getElementById("sortOrderInput").value = "asc";

      document.getElementById("resultTable").style.display = "none";
      document.getElementById("status").textContent =
        `${members.length}人分のデータを読み込みました。検索条件を入力してください。`;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    createHeightOptions(
      document.getElementById("heightMinPickerInput"),
      "指定なし"
    );

    createHeightOptions(
      document.getElementById("heightMaxPickerInput"),
      "指定なし"
    );

    document.getElementById("birthdayModeInput")
      .addEventListener("change", updateBirthdayInputMode);

    document.getElementById("heightModeInput")
      .addEventListener("change", updateHeightInputMode);

    document.getElementById("searchButton")
      .addEventListener("click", searchMembers);

    document.getElementById("resetButton")
      .addEventListener("click", resetSearch);

    updateBirthdayInputMode();
    updateHeightInputMode();
    loadMembers();
  </script>
</body>
</html>
